    <p>I am having fun with JS</p>

    <table>
      <thead>
        <tr>
          <th>First</th>
          <th>Second</th>
          <th>Third</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="first"></td>
          <td id="second"></td>
          <td id="third"></td>
        </tr>
      </tbody>
    </table>

    <script>
      const first = Number(prompt("Enter the first number:"));
      const second = Number(prompt("Enter the second number:"));
      const third = first + second;

      document.getElementById("first").textContent = first;
      document.getElementById("second").textContent = second;
      document.getElementById("third").textContent = third;
    </script>
  </body>
